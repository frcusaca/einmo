[workspace]
members = [".", "zweimomo"]
resolver = "2"

# Only `einmo` (this root package) is published to crates.io. `zweimomo` is
# a demo/debugging tool exercising einmo against real fixtures — never
# published (EIMP-2 §8).
[package]
name = "einmo"
version = "0.0.5"
edition = "2024"
description = "Directory-based, cryptographically signed snapshot testing with a staged promotion pipeline."
license = "MIT"
repository = "https://github.com/frcusaca/einmo"
readme = "README.md"
keywords = ["testing", "snapshot", "approval-testing", "signing", "ed25519"]
categories = ["development-tools::testing"]

[dependencies]
ed25519-dalek = "2"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
rpassword = "7"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
thiserror = "2"
similar = "2"
sha2 = "0.10"
# In-process key wrapping (KEK): a cached stage key is held encrypted between
# uses and unwrapped only for the duration of one signing call.
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Section-level post-quantum attestation (EIMP-1 S.11): SLH-DSA at the
# conservative (large-signature, slow-signing) parameter set. Pure Rust, no
# default features -- only the one parameter set this EIMP uses.
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_256s"] }
# einmo-review-server (EIMP-2): a minimal HTTP prototype over a unix-domain
# socket. Typed extractors throughout -- see EIMP-2.md §3a. axum 0.7's
# serve() is TCP-only, so the UDS accept loop is hand-rolled: hyper's HTTP/1.1
# connection builder (a local socket never needs h2) over hyper-util's
# TokioIo, feeding each accepted UnixStream into the axum Router (a
# tower::Service) via hyper-util's TowerToHyperService glue.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
hyperlocal = "0.9"

[dev-dependencies]
tempfile = "3"

# The single CLI app. `cargo install einmo` yields two binary targets sharing
# the same clap parser: `einmo` (canonical) and `cargo-einmo` (the
# cargo-subcommand alias so `cargo einmo …` also works).
[[bin]]
name = "einmo"
path = "src/main.rs"

[[bin]]
name = "cargo-einmo"
path = "src/bin/cargo_einmo.rs"

# The einmo-review-server prototype (EIMP-2) and its cargo-subcommand alias.
[[bin]]
name = "einmo-review-server"
path = "src/bin/einmo_review_server.rs"

[[bin]]
name = "cargo-einmo-review-server"
path = "src/bin/cargo_einmo_review_server.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
