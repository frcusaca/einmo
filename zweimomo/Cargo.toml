[package]
name = "zweimomo"
version = "0.0.1"
edition = "2024"
description = "Einmo's companion test crate (JavaScript-only slice): a pure-Rust Evaluator impl (boa_engine) exercising einmo's signed-snapshot pipeline against real signed fixtures."
license = "MIT"
# Demo/debugging tool, not a library for external use — never published.
publish = false

# Zweimomo depends on einmo (the framework under test) and boa_engine (the
# evaluator). Unlike the original three-language zweimomo in the foolish-rust
# workspace, this JavaScript-only slice has no foolish-ubca/foolish-core
# dependency (no cross-repo path dependency) and no rustpython-vm (EIMP-2
# §8, Rejected Alternative G).
[dependencies]
einmo = { path = ".." }
# Exact pin: interpreter output text is part of the signed baselines, so a
# version bump implies a corpus re-review.
boa_engine = "=0.21.1"

[dev-dependencies]
tempfile = "3"
